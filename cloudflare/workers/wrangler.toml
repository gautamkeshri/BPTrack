name = "bptrack-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

account_id = "0564c338e25512b9a5a4f45585b8fa8b"

[build]
command = "npm run build"

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,http://localhost:5000,https://bptrack.pages.dev,https://*.pages.dev,https://bptrack.gautamlabs.in"
SESSION_SECRET = "development-secret-change-in-production"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "bptrack-db"
database_id = "4cf465e3-2786-4c6d-a0f1-ef2acf923d2a"

# Workers KV binding for sessions
[[kv_namespaces]]
binding = "SESSIONS"
id = "55dc933c60534a52b641e13db27404f4"

# Production environment
[env.production]
[env.production.vars]
ALLOWED_ORIGINS = "https://bptrack.pages.dev,https://*.pages.dev,https://bptrack.gautamlabs.in"
SESSION_SECRET = "change-this-to-a-secure-random-string"

[[env.production.d1_databases]]
binding = "DB"
database_name = "bptrack-db"
database_id = "4cf465e3-2786-4c6d-a0f1-ef2acf923d2a"

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "55dc933c60534a52b641e13db27404f4"
